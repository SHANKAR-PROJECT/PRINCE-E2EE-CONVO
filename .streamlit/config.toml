[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 5000
address = "0.0.0.0"
maxUploadSize = 200
enableWebsocketCompression = true
cookieSecret = "randomsecretstring"

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
serverPort = 8501

[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#0a0e27"
secondaryBackgroundColor = "#001a33"
textColor = "#00E5FF"
font = "sans serif"
